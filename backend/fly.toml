# fly.toml app configuration file generated for geosentinelai-vhihuq on 2026-11-22T03:44:32Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'geosentinelai-vhihuq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  EVIDENCE_STORAGE_PROVIDER = 'cloudflare-r2'
  PORT = '8080'
  TRAINING_ENABLED = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
